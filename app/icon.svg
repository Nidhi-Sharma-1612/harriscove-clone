<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy background with rounded corners -->
  <rect width="32" height="32" rx="7" fill="#0d1b2e"/>

  <!-- Anchor icon in gold (#c9963a) -->
  <!-- Top circle -->
  <circle cx="16" cy="8.5" r="2.5" stroke="#c9963a" stroke-width="1.8" fill="none"/>

  <!-- Vertical shaft -->
